<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#122033">
  <meta name="description" content="View your Frozen Blooded Telegram bot profile.">
  <title>Miss Fr❄️zen — Profile</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/profile.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="profile-app" class="shell profile-shell" aria-live="polite">
    <header class="top profile-top">
      <div id="profile-bot-avatar" class="bot-avatar snow" aria-hidden="true"><span class="avatar-fallback">❄️</span></div>
      <div>
        <div class="brand">Miss Fr❄️zen</div>
        <div class="sub">synced with the bot</div>
      </div>
    </header>
    <section class="hero-card profile-intro">
      <div class="profile-eyebrow">ACCOUNT</div>
      <h1>Your Profile</h1>
      <p>Rank, stats, roster, and jutsu from the same profile data used by <code>/profile</code>.</p>
    </section>
    <div id="profile-state" class="notice" role="status">Connecting to Telegram…</div>
    <button id="profile-retry" class="secondary profile-retry" type="button" hidden>Try again</button>
    <section id="profile-content" class="profile-content" aria-label="Your bot profile"></section>
    <p class="credit">created by <a href="https://t.me/frozenblooded">𝑭𝒓❄️𝒛𝒆𝒏 𝑩𝒍𝒐𝒐𝒅𝒆𝒅</a></p>
  </main>
  <script src="/js/profile.js"></script>
  <script src="/js/snow.js"></script>
</body>
</html>
