<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04080f">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Your Frozen Blooded bot profile: rank, XP, coins, chakra, roster and jutsu.">
  <title>Frozen Blooded — Profile</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/profile.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="profile-app" class="shell profile-shell">
    <header class="app-header profile-top">
      <div class="brand-mark" aria-hidden="true">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.4v19.2M3.7 7.2l16.6 9.6M20.3 7.2 3.7 16.8"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>
      </div>
      <div>
        <div class="brand-name">Frozen Blooded</div>
        <div class="brand-sub">Konoha · Profile</div>
      </div>
      <span class="header-spacer"></span>
      <span class="sync-pill">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.6 12a7.6 7.6 0 1 1-2.2-5.4"/><path d="M19.6 3.8v4.8h-4.8"/></svg>
        Live
      </span>
    </header>

    <div id="profile-state" class="notice" role="status">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v6"/><circle cx="12" cy="8" r=".9" fill="currentColor" stroke="none"/></svg>
      <div>Connecting to Telegram…</div>
    </div>
    <button id="profile-retry" class="btn btn-ghost profile-retry" type="button" hidden>Try again</button>
    <section id="profile-content" class="profile-content" aria-label="Your bot profile"></section>

    <p class="credit">created by <a href="https://t.me/frozenblooded">𝑭𝒓<span class="credit-snowflake"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.4v19.2M3.7 7.2l16.6 9.6M20.3 7.2 3.7 16.8"/><circle cx="12" cy="12" r="3.2"/></svg></span>𝒛𝒆𝒏 𝑩𝒍𝒐𝒐𝒅𝒆𝒅</a></p>
  </main>
  <script src="/js/icons.js"></script>
  <script src="/js/game.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/snow.js"></script>
</body>
</html>
