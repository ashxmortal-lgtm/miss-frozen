<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef8ff">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Miss Frozen — your Konoha coins, chakra, streak, shinobi and store, synced with the MissFrozen bot.">
  <title>Miss Frozen · Konoha Mini App</title>
  <link rel="stylesheet" href="css/app.css">

          <path d="M26 6 34 21H18Z" fill="#ffffff" opacity=".95"/>
        </g>
      </g>
      <!-- right pine cluster -->
      <g opacity=".92">
        <g transform="translate(318 190)">
          <path d="M26 94V64" stroke="#9fc4de" stroke-width="5" stroke-linecap="round"/>
          <path d="M26 0 49 48H3Z" fill="#b7d6ec"/>

          <path d="M26 0 49 48H3Z" fill="#cfe6f5"/>
          <path d="M26 28 53 82H-1Z" fill="#c5dff1"/>

      <path d="M-10 304c70-14 130 2 200 4 62 2 124-10 200-4v18H-10Z" fill="#f7fcff" opacity=".85"/>

      </div>
      <noscript><div class="notice warn"><div><strong>JavaScript is off.</strong><div>Open this Mini App from Telegram to load your account.</div></div></div></noscript>
    </div>
  </main>
  <script src="js/contract.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/game.js"></script>
  <script src="js/streak.js"></script>

</html>
